services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer

    ports:
      - "8081:8080"

    depends_on:
      - postgres

  etl:
    build: .

    env_file:
      - .env

    depends_on:
      - postgres

volumes:
  postgres_data: