AWSTemplateFormatVersion: "2010-09-09"

Description: ETL Lambda stack

Parameters:

  DeploymentBucketName:
    Type: String


Resources:

  CsvBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: True
        BlockPublicPolicy: True
        IgnorePublicAcls: True
        RestrictPublicBuckets: True

  CsvBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CsvBucket
      PolicyDocument:
        Statement:
          - Sid: "AllowSSLRequestsOnly"
            Action: "s3:*"
            Principal: "*"
            Effect: "Deny" # Block if...
            Resource:
              - !Sub "${CsvBucket.Arn}"
              - !Sub "${CsvBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"


  ETLLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: roamingrhubarbs-etl-lambda
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !Sub 'arn:aws:iam::660759886369:role/lambda-execution-role'
      Code:
        S3Bucket: !Ref DeploymentBucketName
        S3Key: lambda.zip


  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ETLLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt CsvBucket.Arn




Outputs:

  LambdaName:
    Value: !Ref ETLLambda
